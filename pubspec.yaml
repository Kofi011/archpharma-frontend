name: archpharma
description: Wholesale Pharmacy Sales, Inventory & Invoice Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0

  # Offline Database & Persistence
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

  # Network
  dio: ^5.4.0

  # Dependency Injection & Utilities
  get_it: ^7.6.6
  intl: ^0.19.0

  # UI, Charts & Hardware Integration
  fl_chart: ^0.66.0
  pdf: ^3.10.7
  printing: ^5.11.1
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
